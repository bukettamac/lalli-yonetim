<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>LALLİ · Yönetim</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F6F1EA;--card:#FFFDF9;--line:#E6DACA;--line2:#EFE6D9;
  --ink:#2A2220;--ink2:#4A3E3A;--muted:#7A6A62;
  --ruby:#8E1630;--rubyd:#6E0F24;--rubyl:#F6E2E6;--gold:#9A7741;--goldl:#F5ECDD;
  --ok:#1F6B45;--okl:#E3F1E8;--warn:#8A5A12;--warnl:#F7EDD9;--info:#2D5A86;--infol:#E4EDF6;--bad:#9B1C1C;--badl:#FBE4E4;--grey:#5E5A57;--greyl:#EEEAE6;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost','Helvetica Neue',Arial,sans-serif;
  --r:14px;color-scheme:light
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ruby);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;font-weight:500}
.brand{font-family:var(--serif);font-size:26px;letter-spacing:.3em;color:var(--ruby)}

/* giriş */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lbox{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(42,34,32,.08)}
.lbox .brand{text-align:center;font-size:32px}
.lbox p{margin:0;text-align:center;color:var(--muted);font-size:14px}

/* form öğeleri */
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2);min-width:0}
.f > span{font-weight:500}
.in,.f input,.f select,.f textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 12px;font-size:15px}
.f textarea{min-height:80px;resize:vertical}
.f small{color:var(--muted);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;letter-spacing:.02em;white-space:nowrap}
.btn:hover{background:#000}
.btn.ruby{background:var(--ruby);border-color:var(--ruby)}.btn.ruby:hover{background:var(--rubyd)}
.btn.line{background:transparent;color:var(--ink);border-color:var(--line)}.btn.line:hover{border-color:var(--ink)}
.btn.sm{min-height:34px;padding:0 13px;font-size:12.5px}
.btn.danger{background:transparent;color:var(--bad);border-color:#E8C4C4}.btn.danger:hover{background:var(--badl)}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;padding:0;color:var(--ruby);text-decoration:underline;font-size:inherit}
.msg{font-size:13px;min-height:18px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}

/* kabuk */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px}
.side .brand{padding:0 10px 4px}
.side .sub{padding:0 10px 18px;font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:none;text-align:left;font-size:14.5px;color:var(--ink2)}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav button:hover{background:var(--bg)}
.nav button[aria-current=page]{background:var(--rubyl);color:var(--ruby);font-weight:500}
.nav .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--ruby);color:#fff;font-size:11.5px;display:inline-flex;align-items:center;justify-content:center}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px;word-break:break-all}
.main:focus{outline:none}
.main{min-width:0;padding:26px clamp(16px,3vw,36px) 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-family:var(--serif);font-size:34px;line-height:1.05}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.mbar{display:none}

/* kartlar */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h2{font-family:var(--serif);font-size:22px;margin-bottom:12px}
.card h2 small{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-left:6px;font-weight:400}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:34px;line-height:1.05;font-weight:600}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.alert{border-color:#E9C9CF;background:#FFF9FA}
.kpi.alert .v{color:var(--ruby)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;min-height:34px;padding:0 13px;border-radius:999px;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}

/* grafik */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--line2);stroke-width:1}
.chart .bar{fill:var(--ruby)}
.chart .hit{fill:transparent}
.chart .hit:hover + .bar,.chart g:hover .bar{fill:var(--rubyd)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;z-index:3}
.tip b{display:block;font-size:14px}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.hb .t{height:10px;background:var(--line2);border-radius:99px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--ruby);border-radius:99px}
.hb .n{font-variant-numeric:tabular-nums;color:var(--ink2);min-width:70px;text-align:right}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:14px}

/* tablo */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#FBF6EF}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .muted{color:var(--muted);font-size:12.5px}
.tblwrap{overflow-x:auto;margin:0 -6px}

/* durum etiketi */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-bek{color:var(--warn);background:var(--warnl)}
.st-haz{color:var(--info);background:var(--infol)}
.st-kar{color:#6A3F8E;background:#EFE6F6}
.st-tes{color:var(--ok);background:var(--okl)}
.st-ipt,.st-iad{color:var(--grey);background:var(--greyl)}
.pay-odendi{color:var(--ok);background:var(--okl)}.pay-bekliyor{color:var(--warn);background:var(--warnl)}.pay-basarisiz{color:var(--bad);background:var(--badl)}.pay-manuel{color:var(--info);background:var(--infol)}.pay-iade{color:var(--grey);background:var(--greyl)}

/* araç çubuğu */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools .in{max-width:320px;flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;min-height:34px;padding:0 13px;font-size:13px;color:var(--ink2)}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips .c{opacity:.7;margin-left:4px}

/* sağ panel */
.scrim{position:fixed;inset:0;background:rgba(30,25,24,.35);z-index:40}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.12)}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel .ph h2{font-family:var(--serif);font-size:26px}
.panel .pb{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.panel .pf{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;font-size:18px;line-height:1}
.sec h3{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.items{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:12px}
.items .it{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid var(--line2);font-size:14px}
.items .it:first-child{border-top:0}
.items .it small{display:block;color:var(--muted);font-size:12.5px}
.sumrows{display:flex;flex-direction:column;gap:4px;font-size:14px;margin-top:8px}
.sumrows div{display:flex;justify-content:space-between}
.sumrows .tot{font-weight:600;font-size:16px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.copy{font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--ruby)}

/* paylaşımlar */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.post img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--line2)}
.post.hid img{opacity:.35}
.post .pb2{padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.post .acts{display:flex;gap:6px;flex-wrap:wrap}

/* bildirim */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:340px}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}

.modes{display:grid;gap:12px;margin-bottom:16px}
.mode{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer}
.mode:has(input:checked){border-color:var(--ruby);background:#FFF9FA}
.mode input{width:20px;height:20px;margin-top:3px;accent-color:var(--ruby);flex:none}
.mode b{display:block;font-size:16px;margin-bottom:2px}
.mode span{color:var(--muted);font-size:13.5px}
.ol{margin:6px 0 0;padding-left:20px;line-height:1.7;font-size:14px}
.editor{width:100%;height:calc(100vh - 150px);min-height:600px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.note{background:var(--goldl);border:1px solid #EADBC2;border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ink2)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(280px,86vw);z-index:50;transform:translateX(-105%);transition:transform .25s}
  .side.open{transform:none;box-shadow:20px 0 50px rgba(0,0,0,.2)}
  .mbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
  .mbar .brand{font-size:21px}
  .main{padding:18px 14px 60px}
  .top h1{font-size:28px}
  .g2{grid-template-columns:minmax(0,1fr)}
  .tbl.resp thead{display:none}
  .tbl.resp tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 4px;border-bottom:1px solid var(--line2)}
  .tbl.resp td{border:0;padding:0}
  .tbl.resp td.hide-m{display:none}
  .tbl.ord td:nth-child(6){order:2;text-align:right}.tbl.ord td:nth-child(2){order:3}.tbl.ord td:nth-child(5){order:4;justify-self:end}.tbl.ord td:nth-child(4){display:none}
  .row2{grid-template-columns:1fr}
  .modes{display:grid;gap:12px;margin-bottom:16px}
.mode{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer}
.mode:has(input:checked){border-color:var(--ruby);background:#FFF9FA}
.mode input{width:20px;height:20px;margin-top:3px;accent-color:var(--ruby);flex:none}
.mode b{display:block;font-size:16px;margin-bottom:2px}
.mode span{color:var(--muted);font-size:13.5px}
.ol{margin:6px 0 0;padding-left:20px;line-height:1.7;font-size:14px}
.editor{height:calc(100vh - 170px)}
}
@media (max-width:480px){.kpis{gap:10px}.kpi{padding:13px 14px}.kpi .v{font-size:27px}.hb{grid-template-columns:minmax(70px,110px) minmax(0,1fr) auto}}
</style>
</head>

<div id="login" class="login" hidden>

    <p>Yönetim paneli</p>
    <label class="f"><span>E-posta</span><input type="email" id="lmail" autocomplete="username" required></label>
    <label class="f"><span>Şifre</span><input type="password" id="lpass" autocomplete="current-password" required></label>
    <button class="btn ruby" type="submit" id="lbtn">Giriş yap</button>

</div>

function bindChart(){
  var el=$('#chart');if(!el||!CH)return;
  var W=Math.max(320,Math.round(el.clientWidth||640)),H=220,pl=46,pb=26,pt=10,n=CH.length,mx=Math.max.apply(null,CH.map(function(x){return x.v;}))||1;
  var step=Math.pow(10,Math.floor(Math.log10(mx)));var nice=Math.ceil(mx/step)*step;if(nice/step<=2)step/=2;var ticks=[];for(var t=0;t<=nice+1e-9;t+=step)ticks.push(t);if(ticks.length>6)ticks=ticks.filter(function(_,i){return i%2===0;});var top_=ticks[ticks.length-1]||nice;
  var bw=(W-pl)/n,gap=Math.min(6,bw*.3),y=function(v){return pt+(H-pt-pb)*(1-v/top_);};

  var every=Math.ceil(n/8);

    s+='<g data-i="'+i+'"><rect class="hit" x="'+(pl+i*bw)+'" y="'+pt+'" width="'+bw+'" height="'+(H-pt-pb)+'"/>'+(d.v?'<path class="bar" d="M'+x+','+(H-pb)+'V'+(yy+Math.min(4,hh))+'q0,-'+Math.min(4,hh)+' '+Math.min(4,w/2)+',-'+Math.min(4,hh)+'H'+(x+w-Math.min(4,w/2))+'q'+Math.min(4,w/2)+',0 '+Math.min(4,w/2)+','+Math.min(4,hh)+'V'+(H-pb)+'z"/>':'')+'</g>';
    if(i%every===0&&(n-1-i>=every/2||i===n-1||n<=8)||(i===n-1&&(n-1)%every>=every/2))s+='<text class="ax" x="'+(pl+i*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+dshort(d.d)+'</text>';});

  el.addEventListener('mouseleave',function(){tip.hidden=true;});
}

  return top('Satış ve ödeme','Sitenin satış durumunu buradan değiştir. Değişiklik kaydedildiği anda sitede geçerli olur.')+
  '<div class="modes" role="radiogroup" aria-label="Satış durumu">'+MODES.map(function(m){return '<label class="mode"><input type="radio" name="smode" value="'+m[0]+'"'+(sh.mode===m[0]?' checked':'')+'><div><b>'+m[1]+'</b><span>'+m[2]+'</span></div></label>';}).join('')+'</div>'+
  '<div class="card" style="margin-bottom:14px"><label class="f"><span>Sipariş sonrası müşteriye gösterilecek not</span><textarea id="s-note" maxlength="600" placeholder="Örn. Ödeme için IBAN: TR00 0000 … Alıcı: … Açıklamaya sipariş numaranı yaz.">'+esc(sh.manualNote||'')+'</textarea><small>“Sipariş al, ödemeyi sonra iste” durumunda teşekkür ekranında görünür.</small></label>'+
  '<div style="display:flex;gap:10px;align-items:center;margin-top:14px"><button class="btn ruby" data-ssave>Kaydet</button><span class="msg" id="s-msg"></span></div></div>'+
  '<div class="card"><h2>Online ödemeyi açmak için</h2><ol class="ol"><li>iyzico’ya üye işyeri başvurusu yap; onaylanınca panelden API ve gizli anahtarı al.</li><li>Önce test için: Vercel › lalli-store › Settings › Environment Variables’a <b>IYZICO_API_KEY</b>, <b>IYZICO_SECRET_KEY</b> ve <b>IYZICO_BASE_URL</b> = https://sandbox-api.iyzipay.com gir; yeniden yayınla.</li><li>Bu sayfada “Online kart ödemesi”ni seç, iyzico test kartlarıyla bir sipariş dene.</li><li>Her şey yolundaysa canlı anahtarları gir, <b>IYZICO_BASE_URL</b>’yi https://api.iyzipay.com yap.</li></ol></div>';
}
document.addEventListener('click',async function(e){
  if(!e.target.closest('[data-ssave]'))return;
  var b=e.target.closest('[data-ssave]'),m=$('#s-msg'),sel=$('input[name=smode]:checked');if(!sel)return;
  b.disabled=true;m.className='msg';m.textContent='Kaydediliyor…';
  var cur=await sb.from('docs').select('data').eq('col','site').eq('id','config').maybeSingle();
  if(cur.error){b.disabled=false;m.className='msg bad';m.textContent='Ayarlar okunamadı.';return;}
  var data=Object.assign({},(cur.data&&cur.data.data)||{});data.shop={mode:sel.value,manualNote:$('#s-note').value.trim()};
  var r=await sb.from('docs').upsert({col:'site',id:'config',data:data});
  b.disabled=false;
  if(r.error){m.className='msg bad';m.textContent='Kaydedilemedi: '+r.error.message;return;}
  S.config=data;m.className='msg ok';m.textContent='Kaydedildi. Sitede geçerli.';toast('Satış durumu: '+MODES.filter(function(x){return x[0]===sel.value;})[0][1],'ok');
});

/* ---------------- SİTE İÇERİĞİ ---------------- */
var ITAB='genel';
function pIcerik(){return top('Site içeriği','Fırsat kartları, ürünler, kategoriler, bölümler, SSS ve yasal metinler. Değişiklikleri önizleyip “Kaydet ve yayınla” ile sitede yayınla.')+'<iframe class="editor" src="/editor.html?tab='+encodeURIComponent(ITAB)+'" title="Site içeriği düzenleyici"></iframe>';}
document.addEventListener('click',function(e){var b=e.target.closest('[data-icerik]');if(b){ITAB=b.dataset.icerik;go('icerik');}});

boot();
})();
</script>
